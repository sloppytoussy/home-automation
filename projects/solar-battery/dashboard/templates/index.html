<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar Battery</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --border: #d8dee6;
      --text: #1c2430;
      --muted: #667085;
      --pv: #d89a00;
      --battery: #198754;
      --grid: #2563eb;
      --load: #c2410c;
      --blue: #2563eb;
      --amber: #b7791f;
      --green: #198754;
      --red: #c62828;
      --gray: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 28px;
      background: #0f172a;
      color: #f8fafc;
      border-bottom: 1px solid #111827;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0; }
    main { max-width: 1240px; margin: 0 auto; padding: 22px; }
    .status-pill, .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #e5e7eb;
      color: #374151;
      white-space: nowrap;
    }
    .status-pill.online, .badge.float { background: #d9f0e2; color: #0f6b3d; }
    .status-pill.offline, .badge.off { background: #e5e7eb; color: #4b5563; }
    .badge.bulk { background: #dbeafe; color: #1d4ed8; }
    .badge.absorption { background: #fef3c7; color: #92400e; }
    .badge.fault { background: #fee2e2; color: #991b1b; }
    .banner {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      background: #eef2f7;
      border-radius: 8px;
      color: #475467;
      font-weight: 600;
    }
    .banner.visible { display: block; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .metric { padding: 14px; min-height: 106px; }
    .label {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0;
    }
    .value { margin-top: 8px; font-size: 2rem; font-weight: 800; line-height: 1; }
    .sub { margin-top: 8px; color: var(--muted); font-size: 0.85rem; }
    .pv { color: var(--pv); }
    .battery { color: var(--battery); }
    .grid { color: var(--grid); }
    .load { color: var(--load); }
    .dashboard {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      align-items: stretch;
    }
    .panel { padding: 16px; min-height: 240px; }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 0.98rem;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .soc-shell {
      height: 34px;
      background: #e5e7eb;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      margin: 14px 0;
    }
    .soc-fill {
      height: 100%;
      width: 0%;
      background: var(--battery);
      transition: width 0.3s ease;
    }
    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .detail {
      background: var(--panel-soft);
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px;
      min-height: 68px;
    }
    .detail strong { display: block; margin-top: 6px; font-size: 1.08rem; }
    .flow-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid #edf0f3;
    }
    .flow-line:last-child { border-bottom: 0; }
    .direction {
      font-weight: 800;
      color: var(--muted);
    }
    .bars { display: grid; gap: 8px; margin-top: 10px; }
    .bar-row {
      display: grid;
      grid-template-columns: 86px 1fr 74px;
      gap: 10px;
      align-items: center;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .bar-track {
      height: 10px;
      background: #e5e7eb;
      border-radius: 5px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; background: var(--grid); }
    .timeline {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
      align-items: end;
      min-height: 120px;
    }
    .day {
      display: flex;
      flex-direction: column;
      justify-content: end;
      gap: 6px;
      min-width: 0;
      height: 120px;
    }
    .day-bar {
      width: 100%;
      min-height: 4px;
      border-radius: 4px 4px 0 0;
      background: var(--pv);
    }
    .day span {
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 900px) {
      header { align-items: flex-start; flex-direction: column; padding: 16px; }
      main { padding: 16px; }
      .summary, .dashboard { grid-template-columns: 1fr; }
      .details { grid-template-columns: 1fr; }
      .timeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  {% raw %}
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const EMPTY_SUMMARY = {
      data_available: false,
      pv_power_w: null,
      pv_yield_today_kwh: null,
      battery_soc_pct: null,
      battery_power_w: null,
      battery_voltage_v: null,
      battery_current_a: null,
      grid_power_w: null,
      ac_load_w: null,
      inverter_output_w: null,
      mppt_state_label: "Unknown",
      last_updated: null,
    };

    function fmtNumber(value, decimals = 0) {
      return value === null || value === undefined ? "—" : Number(value).toFixed(decimals);
    }

    function fmtW(value) {
      if (value === null || value === undefined) return "—";
      const abs = Math.abs(Number(value));
      return abs >= 1000 ? `${(Number(value) / 1000).toFixed(2)} kW` : `${Math.round(Number(value))} W`;
    }

    function fmtSignedW(value) {
      if (value === null || value === undefined) return "—";
      const sign = Number(value) > 0 ? "+" : Number(value) < 0 ? "-" : "";
      return `${sign}${fmtW(Math.abs(Number(value)))}`;
    }

    function mpptClass(label) {
      return String(label || "off").toLowerCase();
    }

    function estimateBatteryTime(summary) {
      const soc = summary.battery_soc_pct;
      const watts = summary.battery_power_w;
      if (soc === null || soc === undefined || !watts || Math.abs(watts) < 10) return "—";
      const usableWh = 24 * 200 * 2;
      const pctRemaining = watts > 0 ? 100 - soc : soc;
      const hours = (usableWh * (pctRemaining / 100)) / Math.abs(watts);
      if (!Number.isFinite(hours)) return "—";
      return `${hours.toFixed(hours >= 10 ? 0 : 1)} h`;
    }

    function shortDate(date) {
      if (!date) return "—";
      const parsed = new Date(date);
      return Number.isNaN(parsed.getTime()) ? String(date).slice(5) : `${parsed.getMonth() + 1}/${parsed.getDate()}`;
    }

    function Metric({ label, value, sub, tone }) {
      return (
        <div className="metric">
          <div className="label">{label}</div>
          <div className={`value ${tone || ""}`}>{value}</div>
          <div className="sub">{sub}</div>
        </div>
      );
    }

    function BatteryPanel({ summary }) {
      const soc = summary.battery_soc_pct;
      const power = summary.battery_power_w;
      const fill = soc === null || soc === undefined ? 0 : Math.max(0, Math.min(100, Number(soc)));
      const direction = power === null || power === undefined ? "Waiting" : power > 10 ? "Charging" : power < -10 ? "Discharging" : "Idle";
      return (
        <section className="panel">
          <div className="panel-header">
            <h2>Battery</h2>
            <span className="direction">{direction}</span>
          </div>
          <div className="value battery">{fmtNumber(soc, 1)}{soc === null || soc === undefined ? "" : "%"}</div>
          <div className="soc-shell"><div className="soc-fill" style={{ width: `${fill}%` }} /></div>
          <div className="details">
            <div className="detail"><span className="label">Power</span><strong>{fmtSignedW(power)}</strong></div>
            <div className="detail"><span className="label">Time</span><strong>{estimateBatteryTime(summary)}</strong></div>
            <div className="detail"><span className="label">Voltage</span><strong>{fmtNumber(summary.battery_voltage_v, 1)} V</strong></div>
            <div className="detail"><span className="label">Current</span><strong>{fmtNumber(summary.battery_current_a, 1)} A</strong></div>
          </div>
        </section>
      );
    }

    function PvPanel({ summary }) {
      return (
        <section className="panel">
          <div className="panel-header">
            <h2>PV</h2>
            <span className={`badge ${mpptClass(summary.mppt_state_label)}`}>{summary.mppt_state_label || "Unknown"}</span>
          </div>
          <div className="flow-line"><span>Today yield</span><strong>{fmtNumber(summary.pv_yield_today_kwh, 2)} kWh</strong></div>
          <div className="flow-line"><span>Current output</span><strong>{fmtW(summary.pv_power_w)}</strong></div>
          <div className="flow-line"><span>Inverter output</span><strong>{fmtW(summary.inverter_output_w)}</strong></div>
        </section>
      );
    }

    function GridPanel({ summary, pv }) {
      const grid = summary.grid_power_w;
      const direction = grid === null || grid === undefined ? "Waiting" : grid > 10 ? "Import" : grid < -10 ? "Export" : "Idle";
      const maxYield = Math.max(1, ...pv.map((row) => Number(row.yield_kwh || 0)));
      return (
        <section className="panel">
          <div className="panel-header">
            <h2>Grid</h2>
            <span className="direction">{direction}</span>
          </div>
          <div className="value grid">{fmtSignedW(grid)}</div>
          <div className="timeline">
            {pv.map((row) => (
              <div className="day" key={row.date}>
                <div className="day-bar" style={{ height: `${Math.max(4, (Number(row.yield_kwh || 0) / maxYield) * 90)}px` }} />
                <span>{shortDate(row.date)}</span>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function StatusPanel({ summary, status }) {
      const onlineClass = status.cerbo_online ? "online" : "offline";
      const updated = summary.last_updated ? new Date(summary.last_updated).toLocaleString() : "—";
      return (
        <section className="panel">
          <div className="panel-header">
            <h2>System Status</h2>
            <span className={`status-pill ${onlineClass}`}>Cerbo {status.cerbo_online ? "online" : "offline"}</span>
          </div>
          <div className="flow-line"><span>MPPT state</span><strong>{summary.mppt_state_label || "Unknown"}</strong></div>
          <div className="flow-line"><span>MPPT online</span><strong>{status.mppt_online ? "Yes" : "No"}</strong></div>
          <div className="flow-line"><span>Inverter online</span><strong>{status.inverter_online ? "Yes" : "No"}</strong></div>
          <div className="flow-line"><span>Last updated</span><strong>{updated}</strong></div>
        </section>
      );
    }

    function App() {
      const [summary, setSummary] = useState(EMPTY_SUMMARY);
      const [status, setStatus] = useState({ data_available: false, cerbo_online: false, mppt_online: false, inverter_online: false });
      const [pv, setPv] = useState([]);

      async function refresh() {
        const [summaryRes, statusRes, pvRes] = await Promise.all([
          fetch("/api/solar/summary"),
          fetch("/api/solar/status"),
          fetch("/api/solar/pv"),
        ]);
        setSummary(await summaryRes.json());
        setStatus(await statusRes.json());
        setPv(await pvRes.json());
      }

      useEffect(() => {
        refresh();
        const timer = setInterval(refresh, 30000);
        return () => clearInterval(timer);
      }, []);

      const gridSub = useMemo(() => {
        const value = summary.grid_power_w;
        if (value === null || value === undefined) return "Waiting";
        return value > 10 ? "Importing" : value < -10 ? "Exporting" : "No flow";
      }, [summary.grid_power_w]);

      return (
        <>
          <header>
            <h1>Solar Battery Dashboard</h1>
            <span className={`status-pill ${status.cerbo_online ? "online" : "offline"}`}>Cerbo GX</span>
          </header>
          <main>
            <div className={`banner ${summary.data_available ? "" : "visible"}`}>
              Waiting for Cerbo GX — collector will populate data when hardware is connected
            </div>
            <section className="summary">
              <Metric label="PV Power" value={fmtW(summary.pv_power_w)} sub="Current output" tone="pv" />
              <Metric label="Battery SOC" value={`${fmtNumber(summary.battery_soc_pct, 1)}${summary.battery_soc_pct == null ? "" : "%"}`} sub={summary.battery_power_w > 10 ? "Charging" : summary.battery_power_w < -10 ? "Discharging" : "Idle"} tone="battery" />
              <Metric label="Grid Flow" value={fmtSignedW(summary.grid_power_w)} sub={gridSub} tone="grid" />
              <Metric label="AC Load" value={fmtW(summary.ac_load_w)} sub="Total consumption" tone="load" />
            </section>
            <section className="dashboard">
              <BatteryPanel summary={summary} />
              <PvPanel summary={summary} />
              <GridPanel summary={summary} pv={pv} />
              <StatusPanel summary={summary} status={status} />
            </section>
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
