# Water tank configuration
# All depth/offset values in centimetres.
# Sensor reads distance from sensor head DOWN to the water surface.
# Level = (depth_cm - sensor_offset_cm) - distance_cm
# Volume = (level_cm / usable_depth_cm) * capacity_liters

tanks:
  - id: tank1
    name: WASAC Mains Tank
    capacity_liters: 5000
    # Physical depth of usable water column in the tank (measure yours)
    depth_cm: 180
    # Distance from sensor mounting point to the very top of the water column
    # when full (usually 5-10 cm gap so sensor is not submerged)
    sensor_offset_cm: 8
    sources:
      - mains
    low_threshold_pct: 20     # alert below this level
    full_threshold_pct: 95    # alert above this (overflow warning)
    pump:
      name: Dayliff DDA 1000P
      # If pump has a smart switch on MQTT, set topic here; otherwise leave blank
      state_topic: ""         # e.g. home/water/pump1/state  (payload: ON/OFF)
    sensor:
      # type: mqtt  — sensor publishes JSON or raw value to an MQTT topic
      # type: tuya  — poll sensor via Tuya local API (fill tuya section below)
      type: mqtt
      topic: home/water/tank1/distance   # MQTT topic the sensor publishes to
      # Key inside JSON payload that holds the distance value.
      # Set to "" if the sensor publishes a raw number (not JSON).
      payload_key: distance
      # Unit the sensor reports in: cm or mm
      unit: cm

    # --- Phase 2: Overflow Detection & Alerting Configuration ---
    # overflow_handling: How tank handles overflow (REQUIRED for Phase 2+)
    #   - "no_outlet": Float valve controls fill, tank cannot overflow (failure = alert)
    #   - "open_outlet": Has 3" outlet below ceiling, safe overflow allowed
    overflow_handling: "no_outlet"

    # inlet_shutoff: How water inflow is controlled
    #   - "float_valve": Automatic cutoff when full
    #   - "manual_valve": Operator controlled
    inlet_shutoff: "float_valve"

    # num_sources: Number of water sources
    #   - "single": Only one source (mains only)
    #   - "multiple": Multiple sources (mains + rain, etc.)
    num_sources: "single"

    # is_critical: Whether to store overflow history in InfluxDB
    #   - true: Store overflow events for trend analysis (critical tanks)
    #   - false: Alert only, no history storage
    is_critical: true

    # alerting_enabled: Whether to send alerts for this tank
    #   - true: Send alerts (production mode)
    #   - false: Log only, no notifications (test mode)
    alerting_enabled: true

    # alert_severity: Override alert severity (optional)
    #   Uses detailed levels: DEBUG, INFO, NOTICE, WARNING, ERROR, CRITICAL
    #   If not set, uses default based on overflow_handling
    # alert_severity: CRITICAL

  - id: tank2
    name: Rainwater / WASAC Tank
    # 1.5m x 2.8m x 3.5m rectangular pool = 14,700 L
    capacity_liters: 14700
    depth_cm: 350
    sensor_offset_cm: 8
    sources:
      - rain
      - mains
    low_threshold_pct: 15
    full_threshold_pct: 95
    pump:
      name: Dayliff DDA 1000P
      state_topic: ""         # e.g. home/water/pump2/state
    sensor:
      type: mqtt
      topic: home/water/tank2/distance
      payload_key: distance
      unit: cm
    # Active source — toggled manually in the dashboard UI when you switch feeds.
    # Stored in InfluxDB as a tag on each reading.
    active_source: rain       # rain | mains

    # --- Phase 2: Overflow Detection & Alerting Configuration ---
    overflow_handling: "open_outlet"
    inlet_shutoff: "float_valve"
    num_sources: "multiple"
    is_critical: false
    alerting_enabled: true

# --- Tuya local API (only needed if sensor.type == tuya) ---
# Get these from the Tuya IoT Platform developer console or the tinytuya wizard.
# Run: python -m tinytuya wizard   in your shell to discover devices.
tuya_devices:
  - tank_id: tank1
    device_id: ""             # e.g. abcdef1234567890
    ip: ""                    # e.g. 192.168.1.50
    local_key: ""             # 16-char key from Tuya IoT console
    version: "3.3"            # protocol version: 3.1, 3.3, or 3.4
    # DP (data point) number that contains the distance/level value
    dp_distance: 1            # check your specific sensor model
    dp_battery: 2             # battery level DP (optional, set 0 to skip)
    poll_interval_s: 60

  - tank_id: tank2
    device_id: ""
    ip: ""
    local_key: ""
    version: "3.3"
    dp_distance: 1
    dp_battery: 2
    poll_interval_s: 60
