<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lighting Control - Home Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root, [data-theme="light"] {
      --bg: oklch(0.985 0.005 240);
      --surface: oklch(1 0 0);
      --surface-2: oklch(0.965 0.006 240);
      --surface-3: oklch(0.94 0.008 240);
      --border: oklch(0.91 0.01 240);
      --border-2: oklch(0.86 0.012 240);
      --text: oklch(0.22 0.015 240);
      --text-2: oklch(0.46 0.012 240);
      --muted: oklch(0.62 0.012 240);
      --accent: oklch(0.72 0.16 75);
      --accent-soft: oklch(0.96 0.04 75);
      --warn: oklch(0.78 0.16 80);
      --ok: oklch(0.7 0.16 155);
      --danger: oklch(0.62 0.21 25);
      --radius: 16px;
      --radius-sm: 10px;
      --font-ui: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: oklch(0.16 0.012 240);
      --surface: oklch(0.21 0.014 240);
      --surface-2: oklch(0.245 0.016 240);
      --surface-3: oklch(0.28 0.018 240);
      --border: oklch(0.32 0.02 240);
      --border-2: oklch(0.4 0.022 240);
      --text: oklch(0.96 0.005 240);
      --text-2: oklch(0.78 0.012 240);
      --muted: oklch(0.6 0.018 240);
      --accent-soft: oklch(0.32 0.06 75);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .app { max-width: 1480px; margin: 0 auto; padding: 28px 40px 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; position: relative; overflow: hidden;
    }
    .brand-mark::before {
      content: ""; width: 14px; height: 18px; border-radius: 7px 7px 4px 4px;
      background: var(--accent); position: absolute; top: 6px;
    }
    .brand-mark::after {
      content: ""; width: 8px; height: 3px; border-radius: 1px;
      background: var(--surface); position: absolute; bottom: 8px;
    }
    .brand-title { font-size: 13px; font-weight: 700; }
    .brand-sub { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
      color: var(--text-2); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    }
    .live-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
    .icon-btn {
      width: 36px; height: 36px; display: grid; place-items: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-2);
    }
    .tab-nav {
      display: flex; gap: 4px; border-bottom: 1px solid var(--border);
      margin-bottom: 28px; overflow-x: auto; scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      border: 0; background: transparent; color: var(--muted); padding: 12px 18px;
      border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
      font-size: 13px; font-weight: 600;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .banner {
      display: flex; gap: 12px; align-items: center; margin-bottom: 24px; padding: 14px 20px;
      border: 1px solid color-mix(in oklch, var(--warn) 35%, var(--border));
      border-radius: var(--radius);
      background: color-mix(in oklch, var(--warn) 14%, var(--surface));
      color: var(--text-2);
    }
    .banner-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .summary-tile, .room-card, .table-card, .coming-soon {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .summary-tile { padding: 20px 22px; }
    .eyebrow {
      color: var(--muted); display: flex; align-items: center; gap: 8px; font-size: 10px;
      font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    }
    .big { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
    .big small, .big-frac { color: var(--muted); font-size: 16px; font-weight: 500; }
    .sub { margin-top: 4px; color: var(--text-2); font-size: 12px; }
    .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .room-card { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
    .room-card.on {
      border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
      background: linear-gradient(180deg, color-mix(in oklch, var(--accent) 5%, var(--surface)), var(--surface) 60%);
    }
    .room-card.off { background: var(--surface-2); }
    .room-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .room-name { font-size: 18px; font-weight: 700; }
    .room-meta { color: var(--muted); font-size: 12px; }
    .bulb-stack { display: flex; gap: 4px; }
    .bulb-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--border-2); }
    .bulb-dot.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 18px color-mix(in oklch, var(--accent) 50%, transparent); }
    .room-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-stat { padding: 12px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
    .mini-stat-label { color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .mini-stat-value { margin-top: 4px; font-family: var(--font-mono); font-size: 18px; font-weight: 700; }
    .device-list { display: flex; flex-direction: column; gap: 8px; }
    .device-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; color: var(--text-2); font-size: 13px; }
    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 8px; }
    .state-dot.on { background: var(--accent); }
    .chip { border-radius: 999px; border: 1px solid var(--border); padding: 3px 8px; color: var(--muted); font-size: 11px; }
    .table-card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 18px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: var(--surface-2); }
    tr:last-child td { border-bottom: 0; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 4px 9px;
      border: 1px solid var(--border); color: var(--text-2); font-size: 12px;
    }
    .status-pill.on { color: var(--text); border-color: color-mix(in oklch, var(--accent) 50%, var(--border)); background: var(--accent-soft); }
    .status-pill.offline { color: var(--danger); }
    .muted { color: var(--muted); }
    .coming-soon { min-height: 360px; display: grid; place-items: center; color: var(--text-2); text-align: center; padding: 40px; }
    .coming-icon { width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 14px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); }
    .coming-title { color: var(--text); font-size: 20px; font-weight: 700; }
    @media (max-width: 900px) {
      .app { padding: 20px 16px 48px; }
      .topbar { align-items: flex-start; }
      .summary { grid-template-columns: 1fr; }
      .rooms-grid { grid-template-columns: 1fr; }
      table { min-width: 760px; }
      .table-card { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  {% raw %}
  <script type="text/babel">
const { useCallback, useEffect, useState } = React;

const TABS = [
  ["overview", "Overview"],
  ["devices", "Devices"],
  ["rooms", "Rooms"],
  ["scenes", "Scenes"],
  ["schedules", "Schedules"],
  ["presence", "Presence"],
];

const phaseCopy = {
  rooms: "Rooms view coming in Phase 2",
  scenes: "Scenes coming in Phase 2",
  schedules: "Schedules coming in Phase 2",
  presence: "Presence detection coming in Phase 2",
};

const icon = {
  bulb: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 14c.2-1 .7-1.7 1.5-2.5A5 5 0 1 0 7.5 11.5C8.3 12.3 8.8 13 9 14"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>,
  power: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>,
  rooms: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>,
  refresh: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg>,
  moon: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/></svg>,
  sun: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>,
};

const fmt = (value, digits = 0) => value === null || value === undefined ? "—" : Number(value).toFixed(digits);
const title = (value) => String(value || "").replace(/_/g, " ").replace(/\b\w/g, (m) => m.toUpperCase());
const rel = (iso) => {
  if (!iso) return "—";
  const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 60) return "just now";
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86400)}d ago`;
};

function useLightingData() {
  const [overview, setOverview] = useState(null);
  const [devices, setDevices] = useState([]);
  const [rooms, setRooms] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const refresh = useCallback(async () => {
    setLoading(true);
    try {
      const [ov, dev, room] = await Promise.all([
        fetch("/api/lighting/overview"),
        fetch("/api/lighting/devices"),
        fetch("/api/lighting/rooms"),
      ]);
      if (!ov.ok || !dev.ok || !room.ok) throw new Error("api unavailable");
      setOverview(await ov.json());
      setDevices(await dev.json());
      setRooms(await room.json());
      setError(null);
    } catch (err) {
      setError("Lighting API unavailable");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    refresh();
    const timer = setInterval(refresh, 30000);
    return () => clearInterval(timer);
  }, [refresh]);

  return { overview, devices, rooms, loading, error, refresh };
}

function Topbar({ theme, setTheme, refresh, loading, currentUser, handleLogout }) {
  return (
    <header className="topbar">
      <div className="brand">
        <div className="brand-mark" />
        <div>
          <div className="brand-title">Lighting Control</div>
          <div className="brand-sub">Home Automation</div>
        </div>
      </div>
      <div className="topbar-right">
        <div className="live-pill">Live</div>
        {currentUser && (
          <div style={{display: "flex", alignItems: "center", gap: "8px"}}>
            <span style={{fontSize: "13px", color: "var(--muted)"}}>
              {currentUser.display_name || currentUser.username}
            </span>
            <button
              onClick={handleLogout}
              style={{
                background: "var(--surface)",
                border: "1px solid var(--border)",
                borderRadius: "var(--radius-sm)",
                color: "var(--text-2)",
                padding: "7px 10px",
                fontSize: "12px",
              }}
            >
              Sign out
            </button>
          </div>
        )}
        <button className="icon-btn" onClick={refresh} title="Refresh">{icon.refresh}</button>
        <button className="icon-btn" onClick={() => setTheme(theme === "light" ? "dark" : "light")} title="Theme">
          {theme === "light" ? icon.moon : icon.sun}
        </button>
      </div>
    </header>
  );
}

function Summary({ overview }) {
  const available = overview && overview.data_available !== false;
  return (
    <>
      {!available && (
        <div className="banner"><span className="banner-dot" /><span><strong>No device data yet</strong> — start the collector to populate</span></div>
      )}
      <section className="summary">
        <div className="summary-tile">
          <div className="eyebrow">{icon.bulb} Devices on</div>
          <div className="big mono">{available ? overview.devices_on : "—"}<span className="big-frac">/ {available ? overview.devices_total : "—"}</span></div>
          <div className="sub">Configured lighting devices</div>
        </div>
        <div className="summary-tile">
          <div className="eyebrow">{icon.power} Total power</div>
          <div className="big mono">{available ? fmt(overview.total_power_w, 1) : "—"}<small>W</small></div>
          <div className="sub">Current measured load</div>
        </div>
        <div className="summary-tile">
          <div className="eyebrow">{icon.rooms} Rooms</div>
          <div className="big mono">{available ? overview.rooms_with_lights_on : "—"}<span className="big-frac">/ {available ? overview.rooms_total : "—"}</span></div>
          <div className="sub">Rooms with lights on</div>
        </div>
      </section>
    </>
  );
}

function Overview({ overview, devices, rooms }) {
  const grouped = {};
  devices.forEach((device) => {
    const room = device.room || "unknown";
    grouped[room] = grouped[room] || [];
    grouped[room].push(device);
  });
  const roomRows = rooms.length ? rooms : Object.keys(grouped).map((room) => ({
    room_id: room,
    name: title(room),
    devices_total: grouped[room].length,
    devices_on: grouped[room].filter((device) => device.is_on).length,
    total_power_w: grouped[room].reduce((sum, device) => sum + Number(device.power_w || 0), 0),
  }));
  return (
    <main>
      <Summary overview={overview} />
      <section className="rooms-grid">
        {roomRows.map((room) => {
          const roomDevices = grouped[room.room_id] || [];
          return (
            <article key={room.room_id} className={`room-card ${room.devices_on > 0 ? "on" : "off"}`}>
              <div className="room-head">
                <div>
                  <div className="room-name">{room.name}</div>
                  <div className="room-meta">{room.devices_total} devices</div>
                </div>
                <div className="bulb-stack">{Array.from({ length: Math.max(room.devices_total, 1) }).map((_, i) => <span key={i} className={`bulb-dot ${i < room.devices_on ? "on" : ""}`} />)}</div>
              </div>
              <div className="room-stats">
                <div className="mini-stat"><div className="mini-stat-label">Devices on</div><div className="mini-stat-value">{room.devices_on}/{room.devices_total}</div></div>
                <div className="mini-stat"><div className="mini-stat-label">Power</div><div className="mini-stat-value">{fmt(room.total_power_w, 1)} W</div></div>
              </div>
              <div className="device-list">
                {roomDevices.map((device) => (
                  <div className="device-row" key={device.device_id}>
                    <span><span className={`state-dot ${device.is_on ? "on" : ""}`} />{device.name}</span>
                    <span className="mono">{device.power_w == null ? "—" : `${fmt(device.power_w, 1)} W`}</span>
                    {device.brightness_pct == null ? <span className="chip">switch</span> : <span className="chip">{fmt(device.brightness_pct)}%</span>}
                  </div>
                ))}
              </div>
            </article>
          );
        })}
      </section>
    </main>
  );
}

function Devices({ devices, currentUser, toggleDevice }) {
  return (
    <section className="table-card">
      <table>
        <thead>
          <tr><th>Name</th><th>Room</th><th>Type</th><th>Status</th><th>Power</th><th>Brightness</th><th>Last seen</th>{currentUser?.role === "admin" && <th style={{width:"32px"}}></th>}</tr>
        </thead>
        <tbody>
          {devices.length === 0 && <tr><td colSpan={currentUser?.role === "admin" ? 8 : 7} className="muted">No devices available</td></tr>}
          {devices.map((device) => (
            <tr key={device.device_id}>
              <td><strong>{device.name}</strong><div className="muted mono">{device.device_id}</div></td>
              <td>{title(device.room)}</td>
              <td>{device.device_type}<div className="muted">{device.generation}</div></td>
              <td>
                <button
                  onClick={() => toggleDevice(device.device_id, !device.is_on)}
                  style={{
                    padding: "3px 10px",
                    borderRadius: "20px",
                    border: "none",
                    cursor: "pointer",
                    fontSize: "12px",
                    fontWeight: "500",
                    background: device.is_on ? "var(--ok)" : "var(--surface-3)",
                    color: device.is_on ? "#fff" : "var(--text-2)",
                  }}
                >
                  {device.is_on ? "On" : "Off"}
                </button>
              </td>
              <td className="mono">{device.power_w == null ? "—" : `${fmt(device.power_w, 1)} W`}</td>
              <td className="mono">{device.brightness_pct == null ? "—" : `${fmt(device.brightness_pct)}%`}</td>
              <td>{rel(device.last_seen)}</td>
              {currentUser?.role === "admin" && (
                <td style={{width:"32px", textAlign:"center"}}>
                  <span title="Admin: device config available in Phase 5" style={{fontSize:"11px", color:"var(--muted)", cursor:"default"}}>
                    ⚙
                  </span>
                </td>
              )}
            </tr>
          ))}
        </tbody>
      </table>
    </section>
  );
}

function ComingSoon({ tab }) {
  return <section className="coming-soon"><div><div className="coming-icon">{icon.bulb}</div><div className="coming-title">{phaseCopy[tab]}</div><div className="muted">Phase 1 keeps the API and navigation ready.</div></div></section>;
}

function App() {
  const [tab, setTab] = useState("overview");
  const [theme, setTheme] = useState("light");
  const [currentUser, setCurrentUser] = useState(null);
  const { overview, devices, rooms, loading, error, refresh } = useLightingData();
  useEffect(() => {
    fetch("/auth/me")
      .then(r => r.json())
      .then(data => {
        if (!data.logged_in) {
          window.location.href = "/auth/login?next=" + encodeURIComponent(window.location.pathname);
        } else {
          setCurrentUser(data);
        }
      })
      .catch(() => {
        window.location.href = "/auth/login";
      });
  }, []);
  useEffect(() => document.documentElement.setAttribute("data-theme", theme), [theme]);

  function handleLogout() {
    fetch("/auth/logout", {method: "POST"})
      .then(() => { window.location.href = "/auth/login"; });
  }

  function toggleDevice(deviceId, newState) {
    fetch(`/api/lighting/devices/${deviceId}/set`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({on: newState})
    }).then(() => refresh());
  }

  return (
    <div className="app">
      <Topbar theme={theme} setTheme={setTheme} refresh={refresh} loading={loading} currentUser={currentUser} handleLogout={handleLogout} />
      <nav className="tab-nav">{TABS.map(([id, label]) => <button key={id} className={`tab-btn ${tab === id ? "active" : ""}`} onClick={() => setTab(id)}>{label}</button>)}</nav>
      {error && <div className="banner"><span className="banner-dot" /><span>{error}</span></div>}
      {tab === "overview" && <Overview overview={overview} devices={devices} rooms={rooms} />}
      {tab === "devices" && <Devices devices={devices} currentUser={currentUser} toggleDevice={toggleDevice} />}
      {!["overview", "devices"].includes(tab) && <ComingSoon tab={tab} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
