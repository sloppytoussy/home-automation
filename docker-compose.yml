services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./infrastructure/influxdb:/etc/influxdb2
    env_file: .env

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - influxdb

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  power-dashboard:
    build: ./projects/power-dashboard
    container_name: power-dashboard
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file: .env
    depends_on:
      - influxdb

  water-collector:
    build: ./projects/water-monitor
    container_name: water-collector
    restart: unless-stopped
    env_file: .env
    depends_on:
      - influxdb
      - mosquitto

  water-dashboard:
    build: ./projects/water-monitor
    container_name: water-dashboard
    restart: unless-stopped
    command: ["gunicorn", "-w", "2", "-b", "0.0.0.0:5002", "dashboard.app:app"]
    ports:
      - "5002:5002"
    env_file: .env
    depends_on:
      - influxdb

  solar-collector:
    build: ./projects/solar-battery
    container_name: solar-collector
    restart: unless-stopped
    env_file: .env
    depends_on:
      - influxdb
      - mosquitto

  solar-dashboard:
    build: ./projects/solar-battery
    container_name: solar-dashboard
    restart: unless-stopped
    command: ["gunicorn", "-w", "2", "-b", "0.0.0.0:5003", "dashboard.app:app"]
    ports:
      - "5003:5003"
    env_file: .env
    depends_on:
      - influxdb

  dns-collector:
    build: ./projects/dns-monitor
    container_name: dns-collector
    restart: unless-stopped
    env_file: .env
    depends_on:
      - influxdb

  dns-dashboard:
    build: ./projects/dns-monitor
    container_name: dns-dashboard
    restart: unless-stopped
    command: ["gunicorn", "-w", "2", "-b", "0.0.0.0:5000", "dashboard.app:app"]
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - influxdb

  lighting-collector:
    build:
      context: .
      dockerfile: projects/lighting-control/Dockerfile
    container_name: lighting-collector
    restart: unless-stopped
    env_file: .env
    depends_on:
      - influxdb
      - mosquitto

  lighting-dashboard:
    build:
      context: .
      dockerfile: projects/lighting-control/Dockerfile
    container_name: lighting-dashboard
    restart: unless-stopped
    command: ["python", "-m", "flask", "--app", "dashboard.app", "run", "--host", "0.0.0.0", "--port", "5005"]
    ports:
      - "5005:5005"
    env_file: .env
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  grafana_data:
  mosquitto_data:
