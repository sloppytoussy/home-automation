<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #111827;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
      }

      main {
        width: min(100% - 32px, 420px);
        padding: 32px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 24px;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      label {
        display: block;
        margin: 0 0 6px;
        font-size: 0.875rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 18px;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font: inherit;
      }

      input:focus {
        outline: 2px solid #2563eb;
        outline-offset: 1px;
        border-color: #2563eb;
      }

      .error {
        margin: 0 0 18px;
        padding: 10px 12px;
        border: 1px solid #fecaca;
        border-radius: 6px;
        background: #fef2f2;
        color: #991b1b;
        font-size: 0.875rem;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      {% if error %}
      <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" action="/auth/login">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
